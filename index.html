<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Conversion Algorithmic Interface</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --accent-gold: #d4af37;
            --accent-gold-dim: #a68a2d;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
        }

        button {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dim) 100%);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .output-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--glass-border);
        }

        .output-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .output-data {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: var(--accent-gold);
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Priority Selection Algorithm</h1>
        <p class="subtitle>Advanced frontend execution with backend-grade logical precision.</p>
        
        <div class="control-panel">
            <div class="input-group">
                <label for="priorities">Priorities Array (comma-separated)</label>
                <input type="text" id="priorities" value="3, 1, 2, 4" placeholder="e.g., 3, 1, 2, 4">
            </div>
            <div class="input-group">
                <label for="k">K (Lowest Priority Count)</label>
                <input type="number" id="k" value="2" min="1" placeholder="e.g., 2">
            </div>
            <button onclick="executeAlgorithm()">Execute Selection</button>
        </div>

        <div class="output-panel">
            <div class="output-label">Resulting Indices</div>
            <div class="output-data" id="output">[]</div>
        </div>
    </div>

    <script>
        function selectPackages(priorities, k) {
            return priorities
                .map((priority, index) => ({ priority, index }))
                .sort((a, b) => a.priority - b.priority)
                .slice(0, k)
                .sort((a, b) => a.index - b.index)
                .map(item => item.index);
        }

        function executeAlgorithm() {
            const prioritiesInput = document.getElementById('priorities').value;
            const kInput = parseInt(document.getElementById('k').value, 10);
            
            const priorities = prioritiesInput.split(',').map(num => parseInt(num.trim(), 10));
            
            if (priorities.some(isNaN) || isNaN(kInput)) {
                document.getElementById('output').textContent = "Invalid input format.";
                return;
            }

            const result = selectPackages(priorities, kInput);
            document.getElementById('output').textContent = `[${result.join(', ')}]`;
        }
    </script>
</body>
</html>
